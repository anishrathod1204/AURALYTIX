<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">AURALYTIX research desk</title>
  <desc id="desc">Search the web, inspect public GitHub repositories, and get source-linked research briefs with related videos when available.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e4dfd4" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#c9c0b0"/>
    </pattern>
  </defs>
  <rect width="1440" height="520" fill="#f3f1eb"/>
  <rect width="1440" height="520" fill="url(#grid)" opacity=".43"/>
  <rect x="34" y="34" width="1372" height="452" rx="2" fill="#fffefa" stroke="#d8d3c9"/>
  <path d="M34 132H1406" stroke="#d8d3c9"/>
  <rect x="71" y="72" width="46" height="46" fill="#19211c"/>
  <path d="M82 105V83h6l7 12 7-12h6v22h-6V93l-7 11-7-11v12z" fill="#e2b47b"/>
