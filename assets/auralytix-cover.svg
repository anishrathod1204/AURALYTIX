  <text x="132" y="113" fill="#747d75" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">RESEARCH DESK / LOCAL FIRST</text>
  <text x="74" y="218" fill="#885a2d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.6">WEB RETRIEVAL  /  EVIDENCE  /  BRIEF</text>
  <text x="70" y="294" fill="#202721" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-2">A question,</text>
  <text x="70" y="367" fill="#202721" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-2">followed to its sources.</text>
  <text x="74" y="413" fill="#545d55" font-family="Arial, Helvetica, sans-serif" font-size="16">Search the web. Review public code. Read the evidence behind an answer.</text>
  <path d="M1002 194V423" stroke="#b17a40"/>
  <text x="1030" y="211" fill="#747d75" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">THE REQUEST PATH</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1030" y="264" fill="#885a2d" font-size="13">01</text><text x="1070" y="264" fill="#202721" font-size="16">Question</text><text x="1325" y="264" fill="#747d75" font-size="10" text-anchor="end">TEXT / VOICE</text>
    <path d="M1030 280H1360" stroke="#e8e4dc"/>
    <text x="1030" y="322" fill="#885a2d" font-size="13">02</text><text x="1070" y="322" fill="#202721" font-size="16">Retrieval</text><text x="1325" y="322" fill="#747d75" font-size="10" text-anchor="end">WEB / LIVE DATA</text>
    <path d="M1030 338H1360" stroke="#e8e4dc"/>
    <text x="1030" y="380" fill="#885a2d" font-size="13">03</text><text x="1070" y="380" fill="#202721" font-size="16">Research brief</text><text x="1325" y="380" fill="#747d75" font-size="10" text-anchor="end">ANSWER / SOURCES</text>
    <path d="M1030 396H1360" stroke="#e8e4dc"/>
